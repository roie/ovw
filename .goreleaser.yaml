version: 2

project_name: ovw

before:
  hooks:
    - go mod tidy

builds:
  - id: ovw
    main: .
    binary: ovw
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X ovw/internal/buildinfo.Version={{ .Version }}

archives:
  - id: ovw
    ids:
      - ovw
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: ovw
    ids:
      - ovw
    repository:
      owner: roie
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/roie/ovw
    description: A terminal overview for your local projects.
    license: MIT
    binaries:
      - ovw

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
